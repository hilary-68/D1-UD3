<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
    <body>
        <form action="#" th:action="@{/}" th:object="${prueba}" method="post">
            <table>
                <tr>
                    <td>Texto:</td>
                    <td><input type="text" th:field="*{texto}" /></td>
                      <td th:if="${#fields.hasErrors('texto')}" th:errors="*{texto}">Texto Error</td>
                </tr>
                <tr>
                    <td><button type="submit">Enviar</button></td>
                </tr>
            </table>
        </form>
    </body>
</html>
